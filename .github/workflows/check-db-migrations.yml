# SPDX-License-Identifier: AGPL-3.0-only
name: Check DB migrations

on:
  pull_request:
    paths:
      - 'migration/migration/scripts/**'
      - 'migration/migration/environments/**'
      - 'db/initdb.d/**'
      - '.github/scripts/check-db-migrations.sh'
      - '.github/workflows/check-db-migrations.yml'
  push:
    branches:
      - develop
      - main
      - master
    paths:
      - 'migration/migration/scripts/**'
      - 'migration/migration/environments/**'
      - 'db/initdb.d/**'
      - '.github/scripts/check-db-migrations.sh'
      - '.github/workflows/check-db-migrations.yml'
  workflow_dispatch:

jobs:
  check-migrations:
    name: Apply all migration scripts from pre-v1.6.0 schema
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10
        env:
          MYSQL_ROOT_PASSWORD: fosslight
          MYSQL_DATABASE: fosslight
          MYSQL_USER: fosslight
          MYSQL_PASSWORD: fosslight
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Check DB migrations
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: fosslight
          MYSQL_USER: root
          MYSQL_PASSWORD: fosslight
          # Schema before 20230322085317_create_changelog.sql / v1.6.0 migrations
          BASELINE_TAG: v1.5.0
        run: |
          chmod +x .github/scripts/check-db-migrations.sh
          .github/scripts/check-db-migrations.sh
