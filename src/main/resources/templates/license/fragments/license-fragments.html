<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="licensePopupFragment">
    <th:block th:replace="fragments/gridCommonFn :: gridCommonFn"></th:block>
    <th:block th:replace="fragments/detail-script :: detailScriptFragment"></th:block>
    <div class="hold-transition sidebar-mini">
        <div class="wrapper">
            <div class="custom-layout">
                <div class="grid-area p-2">
                    <div class="jqGridSet" style="overflow: hidden">
                        <table id="list">
                            <tr>
                                <td></td>
                            </tr>
                        </table>
                        <div id="pager"></div>
                    </div>
                </div>

                <div class="card m-2" id="informationArea" style="display: none">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-12">
                                <div class="row">
                                    <div class="col-12">
                                        <div class="post clearfix" id="userGuideGroup" style="display: none">
                                            <div class="user-block">
                                                <span class="username text-primary" style="font-size: .85rem">
                                                    User Guide
                                                </span>
                                            </div>
                                            <p class="ml-3" id="licenseUserGuideInfo" style="font-size: .85rem"></p>
                                        </div>
                                        <div class="post" id="restrictionsGroup" style="display: none">
                                            <div class="user-block">
                                                <span class="username text-primary" style="font-size: .85rem">
                                                    Restrictions
                                                </span>
                                            </div>
                                            <p class="ml-3" id="licenseRestrictionInfo" style="font-size: .85rem"></p>
                                        </div>
                                        <div class="post clearfix" id="licenseTextGroup" style="display: none">
                                            <div class="user-block">
                                                <span class="username text-primary" style="font-size: .85rem">
                                                    License text
                                                </span>
                                            </div>
                                            <p class="ml-3" id="licenseTextInfo" style="font-size: .85rem"></p>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="grid-area p-2" id="ossListDiv" style="display: none">
                    <div class="jqGridSet" style="overflow: hidden">
                        <table id="ossList">
                            <tr>
                                <td></td>
                            </tr>
                        </table>
                        <div id="ossPager"></div>
                    </div>
                </div>
                
                <div class="card m-2" id="ossInformationArea" style="display: none">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-12">
                                <div class="row">
                                    <div class="col-12">
                                        <div class="post clearfix" id="ossRestrictionsGroup" style="display: none">
                                            <div class="user-block">
                                                <span class="username text-primary" style="font-size: .85rem">
                                                    Restrictions
                                                </span>
                                            </div>
                                            <p class="ml-3" id="ossRestrictionsInfo" style="font-size: .85rem"></p>
                                        </div>
                                        <div class="post" id="summaryDescriptionGroup" style="display: none">
                                            <div class="user-block">
                                                <span class="username text-primary" style="font-size: .85rem">
                                                    Summary Description
                                                </span>
                                            </div>
                                            <p class="ml-3" id="summaryDescriptionInfo" style="font-size: .85rem"></p>
                                        </div>
                                        <div class="post clearfix" id="importantNotesGroup" style="display: none">
                                            <div class="user-block">
                                                <span class="username text-primary" style="font-size: .85rem">
                                                    Inportant Notes
                                                </span>
                                            </div>
                                            <p class="ml-3" id="importantNotesInfo" style="font-size: .85rem"></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <th:block th:replace="fragments/common-fragments :: loadingWrapFragment"></th:block>
            </div>
        </div>
    </div>
    </div>
    <script th:inline="javascript">
        //<![CDATA[
        /*global $ */
        var data = {
            typeCodes: [],
            tooltipCont: "<div>" +
                "<span style=\"float:left !important;\"><i class=\"far fa-file-alt fa-1-3x\" title=\"Notice\" style=\"margin-right: 10px !important;\"></i>Notice Obligation</span>" +
                "</div>" +
                "<div>" +
                "<span style=\"float:left !important;\"><i class=\"far fa-file-code fa-1-3x\" title=\"Source Code\" style=\"margin-right: 10px !important;\"></i>Source Code Obligation</span>" +
                "</div>",
            existTooltip: false,
            init: function () {
            }
        };

        var pop_fn = {
            displayObligation: function (cellvalue, options, rowObject) {
                var display = "";
                var srcObligation = rowObject["obligationDisclosingSrcYn"];
                var noticeObligation = rowObject["obligationNotificationYn"];

                if (srcObligation == 'Y') {
                    display = "<i class=\"far fa-file-alt fa-1-3x mr-1\" title=\"Notice\"></i><i class=\"far fa-file-code fa-1-3x mr-2\" title=\"Source Code\"></i>";
                } else if (noticeObligation == 'Y') {
                    display += "<i class=\"far fa-file-alt fa-1-3x mr-1\" title=\"Notice\"></i>";
                }

                return display;
            },

            displayLicenseType: function (cellvalue, options, rowObject) {
                var typeCd = JSON.parse([[${@CoCodeManager.getAllValuesJson(@CommonFunction.getCoConstDefVal('CD_LICENSE_TYPE'))}]]);
                var licenseType = rowObject["licenseType"];
                var display = "";

                for (var i = 0; i < typeCd.length; i++) {
                    if (licenseType == typeCd[i].cdDtlNo) {
                        display = typeCd[i].cdDtlNm;
                        break;
                    }
                }

                return display;
            },

            displayNickName: function (cellvalue, options, rowObject) {
                var nickName = rowObject["licenseNicknameStr"];
                var display = "";

                if (nickName != undefined && nickName != null && nickName != "") {
                    var nickNames = nickName.split('|');

                    if (nickNames.length > 0) {
                        for (var i = 0; i < nickNames.length; i++) {
                            if (i != nickNames.length - 1) {
                                display += "#" + nickNames[i] + ", ";
                            } else {
                                display += "#" + nickNames[i];
                            }
                        }
                    }
                }

                return display;
            },
            displayLicenseRestriction: function (cellvalue, options, rowObject) {
                var display = "";
                if (cellvalue != "" && cellvalue != undefined) {
                	let level = "";
                	if (cellvalue.indexOf("|") > -1) {
                		level = cellvalue.split("|")[1];
                		cellvalue = cellvalue.split("|")[0];
                	}
                	let colorClass = "";
                	if ("" != level) {
                		switch (level) {
                			case "1" : colorClass = "badge-success";
                				break;
                			case "2" :
                			case "3" : colorClass = "badge-warning";
                				break;
                			case "4" :
                			case "5" : colorClass = "badge-danger";
                				break;
                			default : colorClass = "badge-gray";
                				break;
                		}
                	} else {
                		colorClass = "badge-gray";
                	}
                	if (cellvalue.includes('"')) {
                		cellvalue = cellvalue.replaceAll('"', '&quot;');
                	}
                	display = "<span class=\"badge " + colorClass + " text-xm\" data-toggle=\"tooltip\" data-placement=\"bottom\" title=\"" + cellvalue + "\" style=\"cursor: pointer\">R</span>";
                }
                return display;
            }
        }

        $(document).ready(function () {
            const idx = [[${licenseInfo['licenseName']}]];

            if ([[${isValid}]] != true) {
                alertify.alert([[#{msg.selfcheck.info.unconfirmed.license}]], function () {
                    window.open("about:blank", "_self").close();
                });
            } else {
            	var data = {
            		ossName : [[${licenseInfo['ossName']}]],
            		ossVersion : [[${licenseInfo['ossVersion']}]],
            		licenseName : [[${licenseInfo['licenseName']}]]
            	}
            	
                $.ajax({
                    url: "/selfCheck/getLicenseData",
                    dataType: 'json',
                    cache: false,
                    data: data,
                    contentType: 'application/json',
                    success: function (data) {
                    	var licenseList = data.licenseList;
                    	var ossList = data.ossList;
                    	
                        $('#list').jqGrid({
                            datatype: 'local',
                            data: licenseList,
                            jsonReader: {
                                repeatitems: false,
                                id: 'licenseId',
                            },
                            colNames: ['ID', 'License Name', 'Identifier', 'License Type', 'Obligation', 'Restriction', 'Website', 'Nick Name', 'License Text', 'User Guide'],
                            colModel: [
                                {name: 'licenseId', index: 'licenseId', key: true, hidden: true},
                                {name: 'licenseName', index: 'licenseName', width: 180, align: 'left'},
                                {name: 'shortIdentifier', index: 'ShortIdentifier', width: 100, align: 'left'},
                                {
                                    name: 'licenseType',
                                    index: 'licenseType',
                                    width: 50,
                                    align: 'left',
                                    formatter: pop_fn.displayLicenseType
                                },
                                {
                                    name: 'obligation',
                                    index: 'obligation',
                                    width: 50,
                                    align: 'left',
                                    formatter: pop_fn.displayObligation,
                                    sortable: false
                                },
                                {
                                    name: 'restrictionStr',
                                    index: 'restrictionStr',
                                    width: 50,
                                    align: 'center',
                                    formatter: pop_fn.displayLicenseRestriction
                                },
                                {
                                    name: 'webpage',
                                    index: 'webpage',
                                    width: 50,
                                    align: 'left',
                                    formatter: 'link2'
                                },
                                {
                                    name: 'licenseNicknameStr',
                                    index: 'licenseNicknameStr',
                                    width: 200,
                                    align: 'left',
                                    formatter: pop_fn.displayNickName
                                },
                                {
                                    name: 'licenseText',
                                    index: 'licenseText',
                                    width: 200,
                                    align: 'left',
                                    hidden: true
                                },
                                {
                                    name: 'description',
                                    index: 'description',
                                    width: 300,
                                    align: 'left',
                                    hidden: true
                                },
                            ],
                            onSelectRow: function (id) {
                                var rowLicenseUserGuide = $('#list').jqGrid('getCell', id, 'description');
                                var rowLicenseRestriction = $('#list').jqGrid('getCell', id, 'restrictionStr');
                                var rowLicenseText = $('#list').jqGrid('getCell', id, 'licenseText');

                                if (rowLicenseUserGuide) {
                                    $("#licenseUserGuideInfo").html(rowLicenseUserGuide.replace(/\n/g, '<br>'));
                                    $("#informationArea").show();
                                    $("#userGuideGroup").show();
                                } else {
                                    $("#userGuideGroup").hide();
                                }

                                if (rowLicenseRestriction) {
                                	var restrictionInfo = "";
                                	if (rowLicenseRestriction.indexOf("title=") > -1 && rowLicenseRestriction.indexOf("style=") > -1) {
                                		restrictionInfo = rowLicenseRestriction.substring(rowLicenseRestriction.indexOf("title")+7, rowLicenseRestriction.indexOf("style")-2);
                                	}
                                    $("#licenseRestrictionInfo").html(restrictionInfo);
                                    $("#informationArea").show();
                                    $("#restrictionsGroup").show();
                                } else {
                                    $("#restrictionsGroup").hide();
                                }

                                if (rowLicenseText) {
                                    $("#licenseTextInfo").html(rowLicenseText.replace(/\n/g, '<br>'));
                                    $("#informationArea").show();
                                    $("#licenseTextGroup").show();
                                } else {
                                    $("#licenseTextGroup").hide();
                                }
                            },
                            autowidth: true,
                            gridview: true,
                            viewrecords: true,
                            loadonce: true,
                            height: 'auto',
                            rowNum: [[${@CommonFunction.getCoConstDefVal('DISP_PAGENATION_MAX')}]],
                            sortname: 'licenseId',
                            sortorder: 'desc',
                            loadComplete: function (data) {
                                // 헤더에 버튼 추가
                                if (!data.existTooltip) {
                                    $('<i class="fa fa-lg fa-info-circle icon-light-gray ml-2" data-toggle="tooltip" data-html="true" data-placement="bottom"></i>').appendTo($("#jqgh_list_obligation"))
                                        .attr("title", data.tooltipCont).tooltip({
                                        content: function () {
                                            return $(this).prop('title');
                                        }
                                    });

                                    data.existTooltip = true;
                                }

                                if (data.records > 0) {
                                    var rowIdx = 0
                                        , rows = this.rows
                                        , rowsCount = rows.length
                                        , row, rowid, rowData, className;

                                    for (var _idx = 0; _idx < rowsCount; _idx++) {
                                        row = rows[_idx];
                                        className = row.className;

                                        if (className.indexOf('jqgrow') !== -1) {
                                            rowid = row.id;
                                            $('#list').jqGrid("setSelection", rowid);

                                            break;
                                        }
                                    }
                                }
                            }
                        });
                        
                        if (ossList.length > 0) {
                        	$("#ossListDiv").show();
                        	
                        	$('#ossList').jqGrid({
                                datatype: 'local',
                                data: ossList,
                                jsonReader: {
                                    repeatitems: false,
                                    id: 'ossId',
                                },
                                colNames: ['ID', 'OSS Name', 'OSS Version', 'License', 'Download Location', 'Homepage', 'Restriction', 'Summary Description', 'Important Notes'],
                                colModel: [
                                    {name: 'ossId', index: 'ossId', key: true, hidden: true},
                                    {name: 'ossName', index: 'ossName', width: 180, align: 'left'},
                                    {name: 'ossVersion', index: 'ossVersion', width: 180, align: 'left'},
                                    {name: 'licenseName', index: 'licenseName', width: 180, align: 'left'},
                                    {name: 'downloadLocation', index: 'downloadLocation', width: 180, align: 'left', formatter: 'link'},
                                    {name: 'homepage', index: 'homepage', width: 180, align: 'left', formatter: 'link'},
                                    {name: 'restrictionStr', index: 'restrictionStr', width: 50, hidden: true, formatter: pop_fn.displayLicenseRestriction},
                                    {name: 'summaryDescription', index: 'summaryDescription', width: 50, hidden: true},
                                    {name: 'importantNotes', index: 'importantNotes', width: 50, hidden: true}
                                ],
                                onSelectRow: function (id) {
                                	var rowRestriction = $('#ossList').jqGrid('getCell', id, 'restrictionStr');
                                    var rowSummaryDescription = $('#ossList').jqGrid('getCell', id, 'summaryDescription');
                                    var rowImportantNotes = $('#ossList').jqGrid('getCell', id, 'importantNotes');

                                    if (rowRestriction) {
                                    	var restrictionInfo = rowRestriction;
                                    	if (rowRestriction.indexOf("title=") > -1 && rowRestriction.indexOf("style=") > -1) {
                                    		restrictionInfo = rowRestriction.substring(rowRestriction.indexOf("title")+7, rowRestriction.indexOf("style")-2);
                                    	}
                                        $("#ossRestrictionsInfo").html(restrictionInfo);
                                        $("#ossInformationArea").show();
                                        $("#ossRestrictionsGroup").show();
                                    } else {
                                        $("#ossRestrictionsGroup").hide();
                                    }

                                    if (rowSummaryDescription) {
                                    	$("#summaryDescriptionInfo").html(rowSummaryDescription.replace(/\n/g, '<br>'));
                                        $("#informationArea").show();
                                        $("#summaryDescriptionGroup").show();
                                    } else {
                                    	$("#summaryDescriptionGroup").hide();
                                    }
                                    
                                    if (rowImportantNotes) {
                                    	$("#importantNotesInfo").html(rowImportantNotes.replace(/\n/g, '<br>'));
                                        $("#informationArea").show();
                                        $("#importantNotesGroup").show();
                                    } else {
                                    	$("#importantNotesGroup").hide();
                                    }
                                },
                                autowidth: true,
                                gridview: true,
                                viewrecords: true,
                                loadonce: true,
                                height: 'auto',
                                rowNum: [[${@CommonFunction.getCoConstDefVal('DISP_PAGENATION_MAX')}]],
                                sortname: 'licenseId',
                                sortorder: 'desc',
                                loadComplete: function (data) {
                                	if (data.records > 0) {
                                        var rowIdx = 0
                                            , rows = this.rows
                                            , rowsCount = rows.length
                                            , row, rowid, rowData, className;

                                        for (var _idx = 0; _idx < rowsCount; _idx++) {
                                            row = rows[_idx];
                                            className = row.className;

                                            if (className.indexOf('jqgrow') !== -1) {
                                                rowid = row.id;
                                                $('#ossList').jqGrid("setSelection", rowid);

                                                break;
                                            }
                                        }
                                    }
                                	
                                    loading.hide();
                                }
                            });
                        }
                    },
                    error: function () {
                        alertify.error([[#{msg.common.valid2}]], 0);
                    }
                });
            }
        });
        //]]>
    </script>
</th:block>
</html>
