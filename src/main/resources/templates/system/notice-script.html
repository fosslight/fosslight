<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="script">
<script th:inline="javascript">
var hasAuth = [[${@CommonFunction.isAdmin()}]];

$(function () {
	noticeList.load();
	
	$("#noticeTextarea").summernote({height: 250, minHeight: null, maxHeight: null, lang: "ko-KR"});
	$("#sDate").datepicker({dateFormat: "yy-mm-dd", changeMonth: true, changeYear: true});
   	$("#eDate").datepicker({dateFormat: "yy-mm-dd", changeMonth: true, changeYear: true});
   	
   	$("#noticeSave").on("click", function () {
   		noticePopup.save();
   	});
});	

// 함수
var fn = {
	// Grid rowid의 max값
	getMaxIdNo: function(grid){
		var ids = [];
		ids = $("#list").jqGrid('getDataIDs');
		
		return (ids.length == 0) ? 0 : Math.max.apply(Math, ids);
	},
	// Grid row 추가
	addRow: function(grid){
		var newIdNo = fn.getMaxIdNo(grid) + 1;
		$("#list").jqGrid("addRowData", newIdNo, {cdNo: newIdNo}, "first");	
	},
	// Grid row 삭제
	delRow: function(gid,delRowId){
		// 삭제할 rowid 저장
		// 기존 row인 경우만 deleteRowList에 추가
		if(delRowId <= noticeList.lastIdNo) {
			noticeList.deleteRowList.push($("#list").jqGrid("getRowData",delRowId));
		}
		
		// 삭제할 rowid가 추가/수정 목록에 있을 경우 삭제
		var idx = noticeList.modifyRowId.indexOf(delRowId);
		
		if(idx != -1) {
			noticeList.modifyRowId.splice(idx, 1);
		}
		
		$("#list").jqGrid('delRowData',delRowId);
	},
	
	// 수정된 마지막 row 저장
	saveLastRow: function(grid){
		$("#list").jqGrid("editCell", 0, 0, false);		// $("#list").jqGrid("editCell", row, col, false); 반드시 edit focus를 해제시킨다. 해제 시키지 않을 경우 값이 <input ....>으로 저장된다.
		$("#list").jqGrid("saveRow", noticeList.lastEditRowId);
		$("#list").jqGrid("setRowData", noticeList.lastEditRowId, false, { background : "#feffc4" });	// 수정된 row 색 변경

		// 수정된 rowid 저장
		if(noticeList.modifyRowId.length == 0) {
			noticeList.modifyRowId.push(noticeList.lastEditRowId);
		} else {
			noticeList.modifyRowId.forEach(function(){		// 중복제외
				if(noticeList.modifyRowId.indexOf(noticeList.lastEditRowId) == -1) {
					noticeList.modifyRowId.push(noticeList.lastEditRowId);
				}
			});
		}
	}
};

// Grid formatter
var gridFormatter = {
	// row 삭제버튼 동적 추가
	delBtn: function(cellvalue, options, rowObject){
		var button = "<input type=\"button\" value=\"delete\" class=\"btnCLight darkgray\" onclick=\"fn.delRow("+"'"+options.gid+"'"+",'"+options.rowId+"')\" />";

		return button;
	}
};

var noticeList = {
	modifyRowId: [],		// 수정된 모든 rowid
	deleteRowList: [],		// 삭제할 LIST
	lastEditRowId: "",		// 마지막 수정된 rowid 저장 변수
	lastIdNo: "",			// 서버에서 가져온 마지막 id
	
	load: function(){
		noticeList.modifyRowId = [];
		noticeList.deleteRowList = [];
		noticeList.lastEditRowId = "";
		
		var rowStr = [[${@CommonFunction.getCoConstDefVal('DISP_PAGENATION_LIST_STR')}]];
		var rowList = rowStr.split(",");
		var rowNum = [[${@CommonFunction.getCoConstDefVal("DISP_PAGENATION_DEFAULT")}]];
		
		$("#list").jqGrid({
			url: '/system/notice/listAjax'
			, datatype: 'json'
			, jsonReader: {
				repeatitems: false,
				id:'gridId',
				root:function(obj){return obj.rows;},
				page:function(obj){return obj.page;},
				total:function(obj){return obj.total;},
				records:function(obj){return obj.records;}
			}
			, colNames: ['gridId', 'Notice No', 'Title', 'Notice', 'notice', 'Start Date', 'End Date', 'Publish', 'Fixed']
			, colModel: [
                {name: 'gridId', index: 'gridId', key:true, editable:false, hidden:true},
                {name: 'seq', index: 'seq', width: 50, align: 'center', editable:true},
				{name: 'title', index: 'title', width: 200, align: 'left', editable:true, editrules : {required: true},
                	formatter: function(cellvalue, options, rowObject) {
                		var rowid = options.rowId;
                		return "<a href='javascript:void(0);' style='color: #0066cc; text-decoration: underline;' onclick='noticePopup.editPopup(\"" + rowid + "\");'>" + cellvalue + "</a>";
                	}
				},
				{name: 'replaceNotice', index: 'replaceNotice', width: 400, align: 'left', editable:false},
                {name: 'notice', index: 'notice', editable:true, hidden:true},
				{name: 'sDate', index: 'sDate', width: 50, align: 'center', editable:true, editrules : {required: true}, 
					editoptions:{
						size:20, 
						dataInit:function(el){ 
							$(el).datepicker({dateFormat:'yy-mm-dd'}); 
						}, 
						defaultValue: function(){ 
							var currentTime = new Date(); 
							var month = parseInt(currentTime.getMonth() + 1); 
							month = month <= 9 ? "0"+month : month; 
							var day = currentTime.getDate(); 
							day = day <= 9 ? "0"+day : day; 
							var year = currentTime.getFullYear(); 
							return year+"-"+month + "-"+day;
						}
					}
				},
				{name: 'eDate', index: 'eDate', width: 50, align: 'center', editable:true, editrules : {required: true}, 
					editoptions:{
						size:20, 
						dataInit:function(el){ 
							$(el).datepicker({dateFormat:'yy-mm-dd'}); 
						}, 
						defaultValue: function(){ 
							var currentTime = new Date(); 
							var month = parseInt(currentTime.getMonth() + 1); 
							month = month <= 9 ? "0"+month : month; 
							var day = currentTime.getDate(); 
							day = day <= 9 ? "0"+day : day; 
							var year = currentTime.getFullYear(); 
							return year+"-"+month + "-"+day;
						}
					}
				},
				{name: 'publishYn', index: 'publishYn', width: 50, align: 'center', editable:true, edittype:"checkbox", editoptions: {value: "Y:N:N"}},
				{name: 'fixYn', index: 'fixYn', width: 50, align: 'center', editable:true, edittype:"checkbox", editoptions: {value: "Y:N:N"}}
			]
			, emptyrecords: "Nothing to display"
			, autoencode: true
			, editurl: 'clientArray'
			, rowNum: rowNum
			, rowList: rowList
			, autowidth: true
			, pager: '#pager'
			, toppager: true
			, gridview: true
			, sortable: function (permutation) {}
			, sortname: 'seq'
			, sortorder: 'desc'
			, height: 'auto'
			, loadonce: false
			, loadComplete: function(data) {
				// Execute only when hasAuth is false
				if (typeof hasAuth !== "undefined" && !hasAuth) {
					var $grid = $("#list");
					// Get all row IDs currently displayed in the grid
					var rowIds = $grid.jqGrid('getDataIDs');
					
					for (var i = 0; i < rowIds.length; i++) {
						var rowid = rowIds[i];
						// Get the data object for the current row
						var rowData = $grid.jqGrid('getRowData', rowid);
						
						// Delete the row if publishYn is 'N' or empty
						if (rowData.publishYn === "N" || rowData.publishYn === "") {
							$grid.jqGrid('delRowData', rowid);
						}
					}
				}
			}
			, onSelectRow: function(rowid, status, e) {
				noticePopup.editPopup(rowid);
			}
			, gridComplete : function() {
				updateGridRowCount('list', 'pager');	
			}
		});
		
		$("#list").jqGrid('navGrid', "#list_toppager", {edit: false, add: false, del: false, search: false, refresh: false});
		
		if (hasAuth) {
			$("#list").jqGrid('navButtonAdd', '#list_toppager', {
				caption: "",
			    buttonicon: "ui-icon-plus",
			    title: "Add",
			    position: "last",
			    onClickButton: function () {
			    	noticePopup.addPopup();
			    }
			});
			
			$("#list").jqGrid('navButtonAdd', '#list_toppager', {
		        caption: "",
		        buttonicon: "ui-icon-trash",
		        title: "Delete",
		        position: "last",
		        onClickButton: function () {
		        	noticePopup.delPopup();
		        }
		    });
		}
	}		
};

var noticePopup = {
	save : function() {
		if (!hasAuth) {
   	        alertify.error("You do not have permission to edit.", 0);
   	        return;
   	    }

   	    $("span.retxt", "#noticeForm").remove();

   	    var postData = {
   	        oper: $("#seq").val() ? "edit" : "add",
   	        seq: $("#seq").val(),
   	        title: $("#title").val(),
   	        notice: $("#noticeTextarea").summernote("code"),
   	        sDate: $("#sDate").val(),
   	        eDate: $("#eDate").val(),
   	        publishYn: $("#publish").is(":checked") ? "Y" : "N",
   	        fixYn: $("#fixed").is(":checked") ? "Y" : "N"
   	    };

   	    $.ajax({
   	        url: "/system/notice/saveAjax",
   	        type: "POST",
   	        data: postData,
   	        dataType: "json",
   	        success: function (response) {
   	            if (response.isValid === false) {
   	                alertify.error([[#{msg.common.valid}]], 0);
   	                createValidMsg("noticeForm", response);
   	            	return;
   	            }
   	            
   	         	alertify.success([[#{msg.common.success}]]);
   	        	$("#noticeModal").modal("hide");
   	        	$("#list").trigger("reloadGrid");
   	        },
   	        error: function () {
   	            alertify.error("Save Fail.");
   	        }
   	    });
	},
	editPopup : function(rowid) {
		var rowData = $("#list").jqGrid("getRowData", rowid);

		$("#seq").val(rowData.seq);
	    $("#noticeNo").val(rowData.seq);
	    
	    var pureTitle = $("<div>").html(rowData.title).text();
	    $("#title").val(pureTitle);
		
	    $("#noticeTextarea").summernote("code", rowData.notice);

	    $("#sDate").val(rowData.sDate);
	    $("#eDate").val(rowData.eDate);

	    $("#publish").prop("checked", rowData.publishYn === "Y");
	    $("#fixed").prop("checked", rowData.fixYn === "Y");
	    
	 	// Default authorization handling
	    if (!hasAuth) {
	    	$("#noticeForm").find("input,textarea").prop("disabled",true);
	        $("#noticeTextarea").summernote("disable");
	        $("#noticeSave").hide();
	        
	     	// Hide unnecessary elements
	        $("#noticeNoDiv").hide();
	        $("#sDate").closest(".form-row").hide();
	        $("#publish").closest(".form-row").hide();
	        $("#noticeSave").hide();

	        // Set Title and Notice inputs to disabled for read-only view
	        $("#title").prop("disabled", true);
	        $("#noticeTextarea").summernote("disable");
	        
	     	// Hide Summernote toolbar for Simple View
	        $("#noticeTextarea").next().find(".note-toolbar").hide();
	   	} else {
	    	$("#noticeForm").find("input,textarea").prop("disabled",false);
	        $("#noticeTextarea").summernote("enable");
	        $("#noticeSave").show();
	        
	     	// Restore elements for regular Edit mode
	        $("#noticeNoDiv").show();
	        $("#sDate").closest(".form-row").show();
	        $("#publish").closest(".form-row").show();
	        $("#noticeNo").prop("readonly", true);
	        
	        // Show Summernote toolbar for regular Edit mode
	        $("#noticeTextarea").next().find(".note-toolbar").show();
	   	}
	    
	   	$("#noticeModal").modal("show");
	},
	addPopup : function() {
		$("#noticeForm")[0].reset();
		
		$("#noticeNoDiv").hide();
	    $("#seq").val("");
	    $("#noticeNo").val("");

	    $("#noticeTextarea").summernote("code", "");

	    $("#publish").prop("checked", true);
	    $("#fixed").prop("checked", false);

	    $("#noticeModal").modal("show");
	},
	delPopup : function() {
		var rowId = $("#list").jqGrid("getGridParam", "selrow");
	    if (!rowId) {
	        alertify.alert("Please select a notice.");
	        return;
	    }
	    
	    var rowId = $("#list").jqGrid("getGridParam", "selrow");

	    if (!rowId) {
	        alertify.alert("Please select a notice.");
	        return;
	    }

	    var rowData = $("#list").jqGrid("getRowData", rowId);

	    alertify.confirm(
	        "Delete",
	        "Are you sure you want to delete this notice?",
	        function () {
	        	var postData = {
	        		oper: "del",
	        		seq: rowData.seq
	        	};

	            $.ajax({
	                url: "/system/notice/saveAjax",
	                type: "POST",
	                data: postData,
	                dataType: "json",
	                success: function (response) {
	                    if (response.isValid == false) {
	                        alertify.error([[#{msg.common.valid}]], 0);
	                        return;
	                    }

	                    alertify.success([[#{msg.common.success}]]);
	                    $("#list").trigger("reloadGrid");
	                },
	                error: function () {
	                	alertify.error([[#{msg.common.valid2}]], 0);
	                }
	            });

	        },
	        function () {
	            return;
	        }
	    );
	}
}
</script>
</th:block>
