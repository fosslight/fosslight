<!DOCTYPE html>

<th:block th:fragment="contentScript">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script th:inline="javascript">
        var dataTable;
        var delayedPrjListTable;
        var l_User = [[${#authentication.name}]];
		var projectStatus = new Array();
        
        $(function () {
        	projectStatus = [[${@CoCodeManager.getCodeDtls(@CommonFunction.getCoConstDefVal('CD_PROJECT_STATUS'))}]];
        	
        	if ([[${projectFlag}]] || [[${partnerFlag}]]) {
        		// progress List
        		list.progProjectCnt();

        		// Job List
        		list.getJobsList();
        	}

        	// Division Statistics

            $(".small-box").on("click", function () {
                var status = $(this).find(".inner p").text().trim();
                list.getSortedByStatusJobsList(status);
            });
            
            $("#searchDate").daterangepicker()
			.on('apply.daterangepicker', function(ev, picker) {
				$("input[name='schStartDate']").val(picker.startDate.format('YYYYMMDD'));
				$("input[name='schEndDate']").val(picker.endDate.format('YYYYMMDD'));
				$(this).val(picker.startDate.format('MM/DD/YYYY') + ' - ' + picker.endDate.format('MM/DD/YYYY'));
			})
			.on('cancel.daterangepicker', function(ev, picker) {
				$("input[name='schStartDate']").val("");
				$("input[name='schEndDate']").val("");
				$(this).val("");
			});
        });

        let _rowPrjId;
        let _rowPrjDivision;
        let _referenceDiv;

        $(document).on('click', '#jobListTable > tbody > tr', function(event) {
        	var rowData = $("#jobListTable").DataTable().row($(this)).data();
            _referenceDiv = rowData.prjDivision.toLowerCase();
            _rowPrjId = rowData.prjId;
            
            var commentId = rowData.prjDivision + "-" + _rowPrjId + " Comment";
        	$("#commentHeader").text(commentId);

            var param = {"referenceDiv": _referenceDiv, "referenceId" : _rowPrjId};
			fn_comment.getCommentsList(param);

            $(this).css("background-color", "#f0f0f0");
            $('#jobListTable > tbody > tr').not(this).css("background-color", "");
        });

        $(document).on("click", "[name ='commentModifyBtn']", function (e){
        	e.preventDefault();
        	_referenceDiv = $(this).nextAll('input').val();
        	var successCallbackParam = {"prjId" : _rowPrjId, "prjDivision" : _rowPrjDivision};
        	fn_comment.editComments($(this).attr("data-commId"), _rowPrjId, _referenceDiv, successCallbackParam);
        });

        $(document).on("click", "[name ='commentDeleteBtn']", function (e){
        	e.preventDefault();
        	var successCallbackParam = {"prjId" : _rowPrjId, "prjDivision" : _rowPrjDivision};
        	fn_comment.deleteComments($(this).attr("data-commId"), successCallbackParam);
        });

        var userDivisionChartObject;
        var list = {
      	  	progProjectCnt : function() {
               	$.ajax({
           			url : '/dashboard/progProjectCnt',
           			type : 'GET',
           			dataType : 'json',
           			cache : false,
           			success : function(data){
                        var progressCnt = 0;
                        var reviewCnt = 0;
                        var requestCnt = 0;
                        var finalReviewCnt = 0;
                        var cntList = data;

                        if (cntList.length > 0) {
                            for (var i in cntList) {
                                var status = cntList[i].status;
                                var cnt = cntList[i].statusCnt;

                                switch (status) {
                                    case "PROG":
                                        progressCnt = cnt;
                                        break;
                                    case "REV":
                                        reviewCnt = cnt;
                                        break;
                                    case "REQ":
                                    	requestCnt = cnt;
                                        break;
                                    case "FREV":
                                        finalReviewCnt = cnt;
                                        break;
                                }
                            }
                        }

                        var $progressView = $("#progressView");

                        var $progressInner = $progressView.find(".bg-success .inner");
                        $progressInner.empty();
                        $progressInner.append("<h3>" + progressCnt + "</h3>");
                        $progressInner.append("<p>Progress</p>");

                        var $requestInner = $progressView.find(".bg-pink .inner");
                        $requestInner.empty();
                        $requestInner.append("<h3>" + requestCnt + "</h3>");
                        $requestInner.append("<p>Request</p>");

                        var $reviewInner = $progressView.find(".bg-warning .inner");
                        $reviewInner.empty();
                        $reviewInner.append("<h3>" + reviewCnt + "</h3>");
                        $reviewInner.append("<p>Review</p>");

                        var $finalReviewInner = $progressView.find(".bg-purple .inner");
                        $finalReviewInner.empty();
                        $finalReviewInner.append("<h3>" + finalReviewCnt + "</h3>");
                        $finalReviewInner.append("<p>Final Review</p>");
                    }
                });
            },
            initJobsList : function (data) {
                dataTable = $('#jobListTable').DataTable({
                	deferRender: true,
                    paging : true,
                    searching : true,
                    info : true,
                    autoWidth : true,
                    responsive : true,
                    lengthChange : true,
                    order: [],
                    ordering : true,
                    destroy: true,
                    data : data.rows,
                    scrollCollapse: true,
                    scrollY: '350px',
					dom: '<"top mb-1"f>rt<"d-flex justify-content-between align-items-center"ip>',
                    columns : [ {
                        data : "prjDivisionId",
                        render: function (data, type, row, meta) {
                            var retnDisplay = "";

                            var retnDisplay = (row.prjDivision).toLowerCase() + "-" + row.prjId;
                            return retnDisplay
                        }
                    }, {
                        data: "prjName",
                        render: function (data, type, row, meta) {
                            var retnDisplay = "";

                            if (row.prjDivision === "PRJ") {
                                retnDisplay = '<span class="urlLink" style="cursor: pointer;" onclick="createTabInFrame(' + row.prjId + '+\'_Project\', \'/project/edit/\'+' + row.prjId + ')">' + data + '</a>';
                            } else if (row.prjDivision === "3RD") {
                                retnDisplay = '<span class="urlLink" style="cursor: pointer;" onclick="createTabInFrame(' + row.prjId + '+\'_3rdParty\', \'/partner/edit/\'+' + row.prjId + ')">' + data + '</a>';
                            }
                            return retnDisplay;
                        }
                    }, {
                        data : "status",
                        render : function(data){
                            var rtnDisplay = "";
                            switch(data) {
                                case "Progress" :
                                    rtnDisplay = '<span class="text-success">' + data + '</span>';
                                    break;
                                case "Request" :
                                    rtnDisplay = '<span class="text-pink">' + data + '</span>';
                                    break;
                                case "Review" :
                                    rtnDisplay = '<span class="text-yellow">' + data + '</span>';
                                    break;
                                case "Final Review" :
                                    rtnDisplay = '<span class="text-purple">' + data + '</span>';
                                    break;
                                case "Complete" :
                                    rtnDisplay = '<span class="text-dark-blue">' + data + '</span>';
                                    break;
                                case "Drop" :
                                    rtnDisplay = '<span class="text-gray">' + data + '</span>';
                                    break;
                            }
                            return rtnDisplay;
                        }
                    }, {
                        data : "stage",
                        render: function (data, type, row, meta) {
                            var rtnDisplay = "";
                            var status = row.status;
							var btnClass = "";

                          	if (row.prjDivision == "PRJ" && (status == "Progress" || status == "Request" || status == "Review")) {
                                rtnDisplay = data;

                                var initDiv;

                                if(row.androidFlag == 'Y') {
                                    initDiv = 4;
                                } else {
                                    initDiv = 0;
                                }
                                
                                switch (status) {
									case "Progress" : btnClass = "badge btn-success hover-success-btn"; 
										break;
									case "Request" : btnClass = "badge badge-pink hover-pink-btn";
										break;
									case "Review" : btnClass = "badge badge-yellow hover-yellow-btn"; 
										break;
								}

                                var prjId = row.prjId;

                                switch (data) {
									case "B":
							        	rtnDisplay = "<span class=\"" + btnClass + " size-sm width-6rem d-flex-align fs-77p\" onclick=\"createTabInFrame('" + prjId + "_Project', '/project/edit/" + prjId + "')\" style=\"cursor: pointer;\">Basic Info</span>";
							        	break;
								    case "I":
								        rtnDisplay = "<span class=\"" + btnClass + " size-sm width-6rem d-flex-align fs-77p\" onclick=\"createTabInFrame('" + prjId + "_Identify', '/project/identification/" + prjId + "/" + initDiv + "')\" style=\"cursor: pointer;\">Identification</span>";
								        break;
								    case "P":
								    	rtnDisplay = "<span class=\"" + btnClass + " size-sm width-6rem d-flex-align fs-77p\" onclick=\"createTabInFrame('" + prjId + "_Packaging', '/project/verification/" + prjId + "')\" style=\"cursor: pointer;\">Packaging</span>";
								        break;
								}
                            }

                            return rtnDisplay;
                        }
                    }, {
                        data : "creator"
                    }, {
                        data : "reviewerName"
                    } ],
                    columnDefs : [
                        {
                            targets : [0],
                            className : "text-center",
                            width: "12%"
                        },
                        {
                            targets : [1],
                            className : "text-center",
                            width: "23%"
                        },
                        {
                            targets : [2],
                            className : "text-center",
                            width: "7%"
                        },
                        {
                            targets : [3],
                            className : "text-center",
                            width: "8%"
                        },
                        {
                            targets : [4],
                            className : "text-center",
                            width: "15%"
                        },
                        {
                            targets : [5],
                            className : "text-center",
                            width: "15%"
                        }
                    ]
                });

                if (data.records > 0) {
                    $('#jobListTable > tbody > tr:first').trigger('click');
                }
           	},
            getSortedByStatusJobsList :  function(status) {
                $.ajax({
                    url : '/dashboard/jobsListAjax',
                    type : 'GET',
                    dataType : 'json',
                    data: {"identificationStatus" : status},
                    cache : false,
                    success : function(data){
                        $("#jobListTable > tbody").remove();
                        list.initJobsList(data);
                    }
                });
            },
            getJobsList : function() {
               	$.ajax({
        			url : '/dashboard/jobsListAjax',
        			type : 'GET',
        			dataType : 'json',
        			cache : false,
        			success : function(data){
                        list.initJobsList(data);
        			}
                });
          	},
            getDiscoveredMailList : function () {
            	$.ajax({
        			url : '/dashboard/discoveredEmlList',
        			type : 'GET',
        			dataType : 'html',
        			cache : false,
        			success : function(data){
        				$("#discoveredSndMail").empty();
        				$("#discoveredSndMail").html(data);
        				$("#discoveredSndMail > tr:first").find("span").trigger("click");
        			}
                });
         	},
            getNvdDashboardList : function () {
            	$.ajax({
        			url : '/dashboard/nvdDashboardList',
        			type : 'GET',
        			dataType : 'html',
        			cache : false,
        			success : function(res){
        				$("#nvdDashboardArea").html(res);

        				let donutDatas = [];
        				$(".severityCnt").each(function(index) {
        					let donutData = {};
        					donutData["data"] = $(this).text();
        					if (index == 0) {
        						donutData["color"] = "#343a40";
        					} else if (index == 1) {
        						donutData["color"] = "#dc3545";
        					} else if (index == 2) {
        						donutData["color"] = "#ffa500";
        					} else {
        						donutData["color"] = "#ffc107";
        					}
        					donutDatas.push(donutData);
        				});

        				$.plot('#severityChart', donutDatas, {
    		                series: {
    		                    pie: {
    		                        show: true,
    		                        radius: 0.8,
    		                        innerRadius: 0.3,
    		                        label: {
    		                            show: true,
    		                            radius: 2 / 3,
    		                            threshold: 0.1
    		                        }
    		                    }
    		                },
    		                legend: {
    		                    show: false
    		                }
    		            });
        			}
                });
           	},
            getLastScoredVulnerability : function () {
               	$.ajax({
        			url : '/dashboard/latestScoredVulns',
        			type : 'GET',
        			dataType : 'html',
        			cache : false,
        			success : function(data){
        				$("#latestVulns").empty();
        				$("#latestVulns").html(data);
        			}
               	});
            },
            getUserDivisionChart : function () {
            	var params = {};
            	params["divisionCode"] = [[${divisionCode}]];
            	params["categoryType"] = "STT";
            	params["startDate"] = $("#startDate").val();
    			params["endDate"] = $("#endDate").val();
            	
    			$.ajax({
    				url : '/statistics/userDivisionChart',
    				type : 'GET',
    				dataType : 'json',
    				cache : false,
    				data : params,
    				success : function(data) {
    					var delayedPrjList = new Array();
    					var chartData = new Array();
    					
    					if (typeof data.chartData !== "undefined") {
    						chartData = data.chartData;
    					}
    					if (typeof data.delayedPrjList !== "undefined") {
    						delayedPrjList = data.delayedPrjList;
    					}
    					
    					chart_fn.renderDivisionStatisticsChart(chartData);
    					chart_fn.renderDelayedProjectList(delayedPrjList);
    				}
            	});
            }
      	}

        var mostUsedOssChartObject;
        var mostUsedLicenseChartObject;

           		params["endDate"] = $("#endDate").val();

           			data : params,

        	renderDivisionStatisticsChart : function (chartData) {
        		const baseLabels = ['Progress', 'Review', 'Request', 'Drop', 'Final Review', 'Complete'];
			    
			    let idenData = new Array(6).fill(0);
			    let packData = new Array(6).fill(0);
			    let distData = new Array(6).fill(0);
			    let progData = new Array(6).fill(0);
			    let revData  = new Array(6).fill(0);
			    let reqData  = new Array(6).fill(0);
			    let dropData = new Array(6).fill(0);
			    let finalData = new Array(6).fill(0);
			    let compData = new Array(6).fill(0);

			    chartData.forEach(item => {
			        let idx = baseLabels.indexOf(item.divisionNm);
			        if (idx === -1) {
			        	return;
			        }

			        const title = item.titleNm;
			        
			        if (title === 'Identification') {
			            idenData[idx] = item.category0Cnt;
			        } else if (title === 'Packaging') {
			            packData[idx] = item.category1Cnt;
			        } else if (title === 'Distribution') {
			            distData[idx] = item.category2Cnt;
			        } else {
			            if (item.divisionNm === 'Progress') {
			            	progData[idx]  = item.category3Cnt;
			            } else if (item.divisionNm === 'Review') {
			            	revData[idx]   = item.category3Cnt;
			            } else if (item.divisionNm === 'Request') {
			            	reqData[idx]   = item.category3Cnt;
			            } else if (item.divisionNm === 'Drop') {
			            	dropData[idx]  = item.category3Cnt;
			            } else if (item.divisionNm === 'Final Review') {
			            	finalData[idx] = item.category3Cnt;
			            } else if (item.divisionNm === 'Complete') {
			            	compData[idx] = item.category3Cnt;
			            }
			        }
			    });
			    
			    const datasets = [
			        { label: 'Identification', data: idenData, backgroundColor: '#28a745' },
			        { label: 'Packaging',      data: packData, backgroundColor: '#ffb400' },
			        { label: 'Distribution',   data: distData, backgroundColor: '#f5a9f2' },
			        { label: 'Drop',           data: dropData, backgroundColor: '#999' },
			        { label: 'Final Review',   data: finalData, backgroundColor: '#702f9f' },
			        { label: 'Complete',       data: compData, backgroundColor: '#1f2d3d' }
			    ];

			    if (userDivisionChartObject) {
			        userDivisionChartObject.data.labels = baseLabels;
			        userDivisionChartObject.data.datasets = datasets;
			        userDivisionChartObject.update();
			    } else {
			        const ctx = $('#userDivisionStatisticsChart').get(0).getContext('2d');
			        userDivisionChartObject = new Chart(ctx, {
			            type: 'bar',
			            data: { labels: baseLabels, datasets: datasets },
			            options: {
			                scales: {
			                    x: { stacked: true },
			                    y: { stacked: true, beginAtZero: true }
			                },
			                onClick: function(event, activeElements, chart) {
			                	if (activeElements.length > 0) {
			                		var elementIndex = activeElements[0].index;
			                        var label = chart.data.labels[elementIndex];
			                        var cdDtlNo = "";
			                        
			                        for (var i in projectStatus) {
			                        	var prjStatus = projectStatus[i];
			                        	if (label == prjStatus.cdDtlNm) {
			                        		cdDtlNo = prjStatus.cdDtlNo;
			                        		break;
			                        	}
			                        }
			                        
			                        var storedData = sessionStorage.getItem('projectSearchConditions');
			                        var searchConditions = {};
			                        
			                        if (storedData) {
			                        	var parsedData = JSON.parse(storedData);
			                        	for (var prop in parsedData) {
			                                if (Object.prototype.hasOwnProperty.call(parsedData, prop)) {
			                                    parsedData[prop] = "";
			                                }
			                            }
			                            searchConditions = parsedData;
			                        }
			                        
			                        searchConditions.defaultSearchType = "PROJECT";
			                        searchConditions.statuses = cdDtlNo;
			                        searchConditions.publicYn = "Y";
			                        
			                        sessionStorage.setItem("projectSearchConditions", JSON.stringify(searchConditions));
			                        createTabInFrame('Project', '/project/list');
			                	}
			                },
			                plugins: {
			                    legend: { position: 'top' },
			                    tooltip: {
			    					callbacks: {
			    						label: function(context) {
			    							let label = context.dataset.label || '';
			    		                    let value = context.raw || 0;
			    		                    
			    		                    let total = 0;
			    		                    context.chart.data.datasets.forEach(dataset => {
			    		                        total += dataset.data[context.dataIndex];
			    		                    });

			    		                    let percentage = total > 0 ? Math.floor(((value/total) * 100)+0.5) : 0;

			    		                    if (label) {
			    		                        label += ': ';
			    		                    }
			    		                    label += value + ' (' + percentage + '%)';
			    		                    return label;
			    						}
			    					}
			    				}
			                }
			            }
			        });
			    }
        	},
        	renderDelayedProjectList : function (list) {
        		delayedPrjListTable = $('#delayedPrjListTable').DataTable({
        			deferRender: true,
        			processing: true,
            		paging : true,
            		searching : false,
            		info : true,
            		autoWidth : true,
            		responsive : true,
            		lengthChange : true,
            		order: [],
            		ordering : true,
            		destroy: true,
            		data : list,
                    scrollCollapse: true,
					scrollY: '350px',
					dom: 'rt<"d-flex justify-content-between align-items-center"ip>',
            		columns : [ {
            				data : "prjId",
            				render: function (data, type, row, meta) {
								var display = "PRJ-" + data;
								
								var permission = row.permission == "1" ? true : false;
								if (permission) {
									var step = row.step;
									var androidFlag = row.androidFlag;
									if ("Identification" == step) {
										if ("Y" != androidFlag) {
											display = "<span class=\"urlLink\" style=\"cursor: pointer;\" onclick=\"chart_fn.mvIdentification(" + data + ", 5)\">" + display + "</a>";
										} else {
											display = "<span class=\"urlLink\" style=\"cursor: pointer;\" onclick=\"chart_fn.mvIdentification(" + data + ", 4)\">" + display + "</a>";
										}
									} else if ("Packaging" == step) {
										display = "<span class=\"urlLink\" style=\"cursor: pointer;\" onclick=\"chart_fn.mvVerification(" + data + ")\">" + display + "</a>";
									} else if ("Distribution" == step) {
										display = "<span class=\"urlLink\" style=\"cursor: pointer;\" onclick=\"chart_fn.mvDistribution(" + data + ")\">" + display + "</a>";
									}
								} else {

            			}, {

            		 		data : "creator",

            					if (type === 'display') {

            						}
            					}
            					return data;
            				}
            			}, {
            		 		data : "status",
            				render: function (data, type, row, meta) {
            					if (type === 'display') {
            						var badgeClass = "";
            						if ("Progress" == data) {
            							badgeClass = "btn-success";
            						} else if ("Review" == data) {
            							badgeClass = "badge-yellow";
            						} else {
            							badgeClass = "badge-pink";
            						}
            						return '<span class="badge ' + badgeClass + '" style="padding: 5px 10px; font-size: 0.9em;">' + data + '</span>';
            					}
            					return data;
            				}
            			}, {
            		 		data : "step"
            			}, {
            				data : "modifiedDate"
            			}, {
            				data : "delayedDate",
            				render: function (data, type, row, meta) {
            					if (type === 'display') {
            						var num = Number(data);
            						if (num === 0) {
            		                    return '<span class="badge badge-success" style="padding: 5px 12px; min-width: 40px;">-</span>';
            		                }
            						if (isNaN(num)) {
            							return data;
            						}
            						
            						var formattedNum = num.toLocaleString();
            		                var unit = (Math.abs(num) === 1) ? ' day' : ' days';
            		                var label = formattedNum + unit;
            		                
            		                var badgeClass = (num > 30) ? 'badge-danger' : 'badge-warning';
            		                
            		                return '<span class="badge ' + badgeClass + '" style="padding: 5px 10px; font-size: 0.9em;">' + label + '</span>';
            					}
            					return data;
							}
