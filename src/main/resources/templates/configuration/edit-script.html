<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="contentScript">
<style>
.daterangepicker {
    z-index: 999999 !important;
}
</style>
<script th:inline="javascript">
    //<![CDATA[
    /*global $ */
    /*jslint browser: true, nomen: true */
    //var defaultLocale = '${sessUserInfo.defaultLocale}';
    let defaultTab = [[${sessUserInfo?.defaultTab}]];

    $(document).ready(function(){
        'use strict';
        data.init();
        evt.init();
    });

    let commentTemp = '';
    let data = {
        init : function() {
            if (!defaultTab) {
                $("[name='defaultTab']:eq(0)").attr("checked", true); // 첫번째 항목을 선택하도록 변경
            } else {
                $.each(defaultTab.split(","), function(idx, val){
                    $("#defaultTab" + val).attr('checked', true);
                });
            }
            $('#configurationForm_01 select[name="defaultLocale"]').trigger('change');
            $('select[name="division"]').trigger('change');

            let userDivision = $('select[name="division"]');
            if ([[${sessUserInfo?.division}]] != [[${@CommonFunction.getCoConstDefVal('CD_USER_DIVISION_EMPTY')}]]) {
            	var isMatch = false;
                for (var i=0;i<userDivision.children().length;i++) {
                    if (userDivision.children()[i].value == [[${sessUserInfo.division}]]) {
                    	isMatch = true;
                        break;
                    }
                }
                if (!isMatch) {
                	$("#division").val(null).trigger('change');
                }
            } else {
            	$("#division").val(null).trigger('change');
            }

            userDivision = $('#userInfoArea select[name="division"]');
            for(var i=0;i<userDivision.children().length;i++){
                if(userDivision.children()[i].value == [[${@CommonFunction.getCoConstDefVal('CD_USER_DIVISION_EMPTY')}]]) {
                    break;
                }
                if(userDivision.children().length - 1 == i ) {
                    let optionVal = [[${@CommonFunction.getCoConstDefVal('CD_USER_DIVISION_EMPTY')}]];
                    userDivision.append(`<option value="` + optionVal + `" ></option>`);
                    if([[${sessUserInfo.division}]] != [[${@CommonFunction.getCoConstDefVal('CD_USER_DIVISION_EMPTY')}]]) {
                        $('#userInfoArea select[name="division"] option:last').attr("selected", "selected");
                        $('#userInfoArea select[name="division"] option:last').change();
                    }
                }
            }
        }
    };

    let evt = {
        init : function(){
            /* set select2 */
           	$("select[name='defaultLocale']").select2({placeholder: "", allowClear: true});
           	$('#division').select2({placeholder: "Division", allowClear: true, width: '100%'});
            
            $("#saveDefaultLocaleButton").on('click',function(){
                alertify.confirm([[#{msg.common.confirm.save2}]], function (e) {
                    if (e) {
                        fn.updateDefaultLocale();
                    } else {
                        return false;
                    }
                });
            });

            $("#saveDefaultListTabButton").on('click',function(){
                if($('input:checkbox[name="defaultTab"]:checked').length == 0){
                    alertify.alert([[#{msg.configuration.required.selectDefaultTab}]], function(){});
                    return false;
                }

                alertify.confirm([[#{msg.common.confirm.save}]], function (e) {
                    if (e) {
                        fn.updateDefaultTabList();
                    } else {
                        return false;
                    }
                });
            });

            $("#passwordEnabled").on('change', function(){
                var isChecked = $('#passwordEnabled').is(":checked");
                $("#password").attr("disabled", !isChecked);
                $("#password").val('');
            });
        }
    };

    let fn = {
    	copy : function() {
    		const expireElem = $("#expireDate"); 
    		if (expireElem) {
    			const dateText = expireElem.text().split(': ')[1];
    	        const today = new Date().toISOString().split('T')[0];
    	        
    	        if (dateText < today) {
    	        	alertify.alert([[#{msg.configuration.token.expired}]], function(){});
                	return false;
    	        }
    	        
    	        $('#token').select();
                var copyFlag = document.execCommand('copy');
                
                if (copyFlag) {
            		alertify.success([[#{msg.common.success}]]);
                } else {
                	alertify.error([[#{msg.common.valid}]]);
                }
    		}
    	},
        loadSearchCondition: function(){
            var searchAreaFlag = $("#defaultSearch option:selected").val();
            $("#searchConditionArea").fadeOut(300);
            $("#searchConditionBtnArea").fadeOut(300);

            if(searchAreaFlag != "") {
                $.ajax({
                    url : "/configuration/loadDefaultSearchCondition",
                    dataType : 'html',
                    cache : false,
                    data : {'defaultSearchType' : searchAreaFlag},
                    success : function(detailResult){
                        $("#searchConditionArea").html(detailResult);
                        $("#searchConditionArea").fadeIn(300);
                        $("#searchConditionBtnArea").fadeIn(300);
                    },
                    error : function(request,status,error){
                        alertify.error([[#{msg.common.valid2}]], 0);
                        $("#defaultSearch").val("");
                    }
                });

            }

        },
        updateSearchCondition: function(){
            // multiple checkbox values to comma separate
            var chkElArr = ["restrictions", "statuses", "status", "priority"];
            $.each(chkElArr, function(index, item){

                var selectedValues  = "";

                $('#searchConditionForm select[name="'+item+'"]').find(':selected').each(function() {
                    if (selectedValues.length === 0) {
                        selectedValues += $(this).val();
                    } else {
                        selectedValues += "," + $(this).val();
                    }
                });

                if(selectedValues.length > 0) {
                    fn.appendFormCheckboxValuesEl(item, selectedValues);
                }
            });

            $("#searchConditionForm").ajaxForm({
                url : "/configuration/updateDefaultSearchCondition",
                type : 'POST',
                dataType:"json",
                cache : false,
                success: fn.onUpdateSuccess,
                error : fn.onError
            }).submit();
        },
        appendFormCheckboxValuesEl(item, selectedValues) {
            $('#searchConditionForm input[name="chk_'+item+'"]').remove();
            var addEl = '<input type="hidden" name="chk_'+item+'" value="'+ selectedValues +'" />';
            $("#searchConditionForm").append(addEl);
        },
        updateDefaultLocale : function () {
            $("#configurationLocaleForm").ajaxForm({
                url : "/configuration/updateDefaultLocale",
                type : 'POST',
                dataType:"json",
                cache : false,
                success: function(json, status){
                    loading.hide();
                    if(json.resCd == '10'){
                        var data = {
                            link: "/index?lang=" + json.result,
                            action: 'changeURL'
                        };
                        parent.postMessage(JSON.stringify(data), "*");
                    }else{
                        alertify.error([[#{msg.common.valid2}]], 0);
                    }
                },
                error : fn.onError
            }).submit();
        },
        updateDefaultTabList : function(eId){
            $("#configurationListForm").ajaxForm({
                url : "/configuration/saveAjax",
                type : 'POST',
                dataType:"json",
                cache : false,
                success: fn.onUpdateSuccess,
                error : fn.onError
            }).submit();
        },
        onUpdateSuccess : function(json, status){
            loading.hide();
            if(json.resCd == '10'){
                alertify.success([[#{msg.common.success}]]);
            }else{
                alertify.error([[#{msg.common.valid2}]], 0);
            }
        },
        onError : function(data, status){
            alertify.error([[#{msg.common.valid2}]], 0);
        },
        changePassword : function(){
        	$('#division').removeClass("is-invalid");
        	
            var params = {};
            var password = $("#password").val();
            var userName = $('input[name="userName"]').val();
            var division = $("#division").val();
            
            if (division == null || "" == division) {
            	$('#division').addClass('is-invalid');
            	alertify.alert("Check the required items", function(){});
            	return false;
            }
            
            alertify.confirm([[#{msg.common.confirm.save}]], function (e) {
                if (e) {
                    $.ajax({
                        type: 'POST',
                        url : "/system/user/updateUserNameAndDivision",
                        data: JSON.stringify({'userName':userName, 'division':division, 'password': password}),
                        contentType : 'application/json',
                        success: function (data) {
                            if("true" != data.isValid) {
                                if(data.validMsg) {
                                    alertify.alert(data.validMsg, function(){});
                                } else {
                                    alertify.error([[#{msg.common.valid2}]], 0);
                                }
                            } else {
                                alertify.success([[#{msg.common.success}]]);
                            }
                        },
                        error : fn.onError
                    });
                } else {
                    return false;
                }
            });
        },
        procToken : function(type) {
        	const htmlContent = `
        		<div class="p-2 mb-2 text-left">
        		    <div class="form-group mb-3">
        		        <label class="text-sm font-weight-bold">Expiration Date</label>
        		        <div class="input-group">
        		            <div class="input-group-prepend" id="btnCalendar" style="cursor: pointer;">
        		                <span class="input-group-text">
        		                    <i class="far fa-calendar-alt"></i>
        		                </span>
        		            </div>
        		            <input type="text" id="expireDate" class="form-control" placeholder="YYYY-MM-DD" style="background-color:#fff;">
        		        </div>
        		    </div>

        		    <div class="mb-2">
        		        <p class="mb-2 text-sm font-weight-bold">
        		            Token Generation Reason <span class="text-danger">*</span>
        		        </p>
        		        <textarea id="tokenPurpose" class="form-control" rows="3" placeholder="Enter the token purpose (Required)" style="resize: none;"></textarea>
        		        <span class="retxt"></span>
        		    </div>
        		</div>
        	`;
        	
        	var dlg = alertify.confirm();
        	dlg.setContent(htmlContent);
        	dlg.set('onok', function(e) {
        	    if (e) {
        	        var purpose = $('#tokenPurpose').val().trim();
        	        var $expireInput = $('.ajs-content #expireDate');
        	        var expireDate = $expireInput.val();
        	        if (!purpose || "" == purpose) {
        	            $(".retxt").html([[#{msg.configuration.required.comment}]]);
        	            $(".retxt").show();
        	            return false;
        	        }
       	        	fn.executeTokenGeneration(type, purpose, expireDate);
        	    }
        	});
        	dlg.set('labels', { ok: 'Generate', cancel: 'Cancel' });
        	dlg.show();

        	setTimeout(function() {
        	    const $input = $('.ajs-content #expireDate');
        	    if ($input.length) {
        	    	$input.daterangepicker({
        	            singleDatePicker: true,
        	            autoApply: true,
        	            parentEl: '.ajs-content',
        	            minDate: moment(),
        	            locale: {
        	                format: 'YYYY-MM-DD'
        	            }
        	        });

        	        $('.ajs-content #btnCalendar').on('click', function(e) {
        	            $input.trigger('focus');
        	        });
        	    }
        	}, 100);
        },
        executeTokenGeneration : function(type, purpose, expireDate) {
        	loading.show();
        	
        	var userInfo = [[${userInfo}]];
        	var url = '/system/user/tokenProc/' + type;
        	
        	if (userInfo != null) {
        		userInfo["purpose"] = purpose;
        		userInfo["expireDate"] = expireDate;
        		var params = {
        			mainData : JSON.stringify(userInfo)
        		};

        		$.ajax({
        			url : url,
        			type : 'POST',
        			dataType : 'json',
        			cache : false,
        			data : JSON.stringify(params),
        			contentType : 'application/json',
        			success : function(data){
        				loading.hide();
        				
        				if (data.isValid == true) {
        					alertify.alert([[#{msg.common.success}]], function() {
        						deleteTabInFrame("/configuration/edit");
    							createTabInFrame("User Settings", "/configuration/edit");
        					});
        				} else {
        					alertify.error([[#{msg.common.valid}]], 0);
        				}
        			},
        			error : function(){
        				alertify.error([[#{msg.common.valid2}]], 0);
        			}
        		});
        	}
        }
    };
    //]]>
</script>
</th:block>
